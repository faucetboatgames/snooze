<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snooze - Keep the Bear Sleeping</title>
    <meta name="description" content="A vintage-style web game where you keep a sleeping bear from waking up for 60 seconds.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --vh: 100dvh;
            --bg-gradient: linear-gradient(135deg, #E8D5E8 0%, #C8B5C8 100%);
            --border-color: #6B4C6B;
            --container-bg: #F5F0E8;
            --text-color: #6B4C6B;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Orbitron', monospace, sans-serif;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }

        #game-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--container-bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Add border only on larger screens */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                position: static;
                height: 100vh;
                padding: 20px;
            }

            #game-container {
                position: relative;
                inset: auto;
                width: min(90vw, 800px);
                height: min(90vh, 600px);
                aspect-ratio: 4/3;
                border: 2px solid var(--border-color);
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            }
        }

        #loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: var(--text-color);
            font-size: clamp(18px, 4vw, 24px);
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            width: clamp(30px, 8vw, 40px);
            height: clamp(30px, 8vw, 40px);
            border: 4px solid #C8B5D4;
            border-top: 4px solid var(--border-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Prevent iOS zoom on focus */
        input, select, textarea {
            font-size: 16px;
        }

        /* Improve touch targets */
        button, [role="button"], [tabindex] {
            min-height: 44px;
            min-width: 44px;
        }

        /* Keyboard visibility handling */
        body.keyboard-visible #game-container {
            transform: translateY(calc(var(--keyboard-offset, 0px) * -0.3));
            transition: transform 0.3s ease;
        }

        /* Canvas touch behavior */
        canvas {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Loading Snooze...</div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
